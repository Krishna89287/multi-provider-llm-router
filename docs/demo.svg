<text x="16" y="182" font-family="monospace" font-size="13" fill="#50FA7B" style="animation: fadeIn 0.1s 1.9s both;">  Provider: openai/gpt-4 | Cost: $0.000045</text>
<text x="16" y="204" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 2.2s both;"></text>
<text x="16" y="226" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 2.5s both;">Prompt: "Summarize this document in 3 bullets"</text>
<text x="16" y="248" font-family="monospace" font-size="13" fill="#8BE9FD" style="animation: fadeIn 0.1s 2.8s both;">  Task: SUMMARIZATION → best fit: Claude Haiku</text>
<text x="16" y="270" font-family="monospace" font-size="13" fill="#50FA7B" style="animation: fadeIn 0.1s 3.1s both;">  Provider: anthropic/claude-3-haiku | Cost: $0.000003</text>
<text x="16" y="292" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 3.4s both;"></text>
<text x="16" y="314" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 3.7s both;">Prompt: "Classify this review: positive/negative"</text>
<text x="16" y="336" font-family="monospace" font-size="13" fill="#8BE9FD" style="animation: fadeIn 0.1s 4.0s both;">  Task: CLASSIFICATION → best fit: Claude Haiku</text>
<text x="16" y="358" font-family="monospace" font-size="13" fill="#50FA7B" style="animation: fadeIn 0.1s 4.3s both;">  Provider: anthropic/claude-3-haiku | Cost: $0.000002</text>
<text x="16" y="380" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 4.6s both;"></text>
<text x="16" y="402" font-family="monospace" font-size="13" fill="#FFB86C" style="animation: fadeIn 0.1s 4.8s both;">Stats: 3 requests | $0.000050 total | 78% savings vs GPT-4</text>
