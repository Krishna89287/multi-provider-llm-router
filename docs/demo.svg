<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>multi-provider-llm-router Demo</title>
<desc>Animated terminal demo showing multi-provider-llm-router in action</desc>
<style>
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
<!-- Terminal background -->
<rect width="680" height="420" rx="12" fill="#282A36"/>
<!-- Title bar -->
<rect width="680" height="36" rx="12" fill="#1E1F29"/>
<rect x="0" y="24" width="680" height="12" fill="#1E1F29"/>
<!-- Traffic lights -->
<circle cx="20" cy="18" r="6" fill="#FF5555"/>
<circle cx="40" cy="18" r="6" fill="#FFB86C"/>
<circle cx="60" cy="18" r="6" fill="#50FA7B"/>
<!-- Title -->
<text x="340" y="23" text-anchor="middle" fill="#F8F8F2" font-family="monospace" font-size="13">multi-provider-llm-router</text>

<text x="16" y="50" font-family="monospace" font-size="13" fill="#50FA7B" style="animation: fadeIn 0.1s 0.0s both;">$</text>
<text x="30" y="50" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 0.0s both;">python router/llm_router.py</text>
<text x="16" y="72" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 0.5s both;"></text>
<text x="16" y="94" font-family="monospace" font-size="13" fill="#50FA7B" style="animation: fadeIn 0.1s 0.7s both;">LLMRouter initialized | strategy=cost_optimized</text>
<text x="16" y="116" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 1.1s both;"></text>
<text x="16" y="138" font-family="monospace" font-size="13" fill="#F8F8F2" style="animation: fadeIn 0.1s 1.3s both;">Prompt: "Write a Python fibonacci function"</text>
