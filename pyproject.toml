[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-provider-llm-router"
version = "0.1.0"
description = "Route each prompt to the cheapest capable LLM, with cost estimation and failover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Only needed to make real API calls; the router runs in mock mode without them.
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=7.4"]

[project.scripts]
llm-router = "llm_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
